name: Sync Macro Data

# 예약 루틴 세션은 main으로 직접 푸시하지 못한다 — `claude/` 접두 브랜치만 허용된다.
# 그래서 루틴은 데이터 전용 브랜치에 푸시하고, 이 워크플로가 **데이터 파일만** main으로 옮긴다.
#
# 루틴 세션은 항상 기본 브랜치를 클론하므로, 예측 기록이 main에 쌓여야
# 다음 실행이 이전 예측을 채점할 수 있다. 그래서 브랜치에 남겨두지 않고 main으로 되돌린다.
#
# **배포는 여기서 하지 않는다.** `github-pages` 환경은 배포 가능한 브랜치를 main으로
# 제한하기 때문에, claude/ 브랜치에서 트리거된 job은 스텝을 실행하기도 전에 거부된다.
# 대신 이 워크플로가 끝나면 `Deploy Macro Desk`가 workflow_run으로 이어받는다.
# (GITHUB_TOKEN으로 한 푸시는 다른 워크플로의 push 트리거를 발동시키지 않는다.)

on:
  push:
    # 루틴 세션이 쓰는 브랜치 이름은 고정이 아니다. 웹 UI가 `claude/blissful-feynman`
    # 같은 이름을 자동으로 붙이기도 한다. 그래서 `claude/` 전체를 받고,
    # 데이터 파일이 실제로 바뀐 푸시에만 반응한다.
    # (`branches`와 `branches-ignore`는 같은 이벤트에 함께 쓸 수 없어 부정 패턴을 쓴다)
    branches:
      - "claude/**"
      - "!claude/day-trading-direction-prediction-*"
    paths:
      - "macro-desk/public/macro.json"
      - "macro-desk/data/**"
      - "macro-desk/src/engine/params.json"
      - "macro-desk/docs/calibration/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macro-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.apply.outputs.changed }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply data files from ${{ github.ref_name }}
        id: apply
        env:
          SOURCE_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch origin "$SOURCE_REF"

          # 허용 목록. 엔진 코드는 절대 이 경로로 들어오지 않는다 —
          # 루틴이 코드를 고쳐도 main에 반영되지 않게 막는 장치다.
          for path in \
            macro-desk/public/macro.json \
            macro-desk/data \
            macro-desk/src/engine/params.json \
            macro-desk/docs/calibration
          do
            if git cat-file -e "origin/$SOURCE_REF:$path" 2>/dev/null; then
              git checkout "origin/$SOURCE_REF" -- "$path"
            fi
          done

          if git diff --cached --quiet; then
            echo "변경 없음 — main이 이미 최신이다"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --cached --stat
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "$(git log -1 --format=%s "origin/$SOURCE_REF")"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
